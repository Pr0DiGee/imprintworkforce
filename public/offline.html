<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline | Imprint Workforce</title>
  <style>
    :root { --bg: #fbfaf7; --card: #ffffff; --text: #1a1a1a; --muted: #6b7280; --accent: #b91c1c; --border: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --card: #1e1e1e; --text: #f3f4f6; --muted: #9ca3af; --border: #2e2e2e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
           background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { max-width: 360px; width: 100%; text-align: center; background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 32px 24px; }
    img { width: 56px; height: 56px; object-fit: contain; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/logo.png" alt="Imprint Global Church" />
    <h1>You're offline</h1>
    <p>Imprint Workforce needs an internet connection. Check your data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
